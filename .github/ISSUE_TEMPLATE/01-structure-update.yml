name: Structure update
description: Fix or replace a compound's source-as-downloaded InChI, SMILES, or InChIKey
title: "[structure_update] "
labels: ["manifest:structure_update"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to correct a single compound's structure in one
        source database. The bot will turn your answers into a
        `structure_update` manifest and open a PR for review. The
        downstream cascade (Print → List → Update → Reprint →
        Provenance → FAISS check) runs after merge.

  - type: dropdown
    id: source
    attributes:
      label: Source database
      description: Which source owns the structure you are editing?
      options:
        - KEGG
        - MetaCyc
        - ChEBI
        - Rhea
    validations:
      required: true

  - type: input
    id: external_id
    attributes:
      label: External ID
      description: |
        Identifier in the source database. Examples: `C00001` (KEGG),
        `WATER` (MetaCyc), `15377` (ChEBI), `GENERIC:11425` (Rhea).
      placeholder: C00001
    validations:
      required: true

  - type: dropdown
    id: field
    attributes:
      label: Field to update
      options:
        - inchi
        - smiles
        - inchikey
    validations:
      required: true

  - type: textarea
    id: new_value
    attributes:
      label: New structure value
      description: |
        Paste the full new InChI, SMILES, or InChIKey string. No
        surrounding quotes; the manifest generator will quote it as
        needed.
      placeholder: "InChI=1S/H2O/h1H2"
      render: text
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: |
        Why this change? Cite sources, related issues, papers — anything
        a future reviewer will need to understand the rationale.
    validations:
      required: true
